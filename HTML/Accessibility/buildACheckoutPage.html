
<!-- Practice concepts like alt attributes and ARIA roles. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Practicing concepts like alt attributes and ARIA roles.">
    <title>Checkout Page</title>
</head>
<body>
    <h1 id="title">Checkout</h1>
    <section id="cart">
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/spoon.jpg" alt="A silver left-handed spoon">

        <p>Left-handed spoon</p>
        <p>$29.99</p>
    </section>
    <section id="payment-information">
        <h2>Payment Information</h2>

        <form action="">
            <label for="card-name">Cardholder Name <span aria-hidden="true">*</span></label>
            <input type="text" id="card-name" name="card-name" required> 
            <br>
            <label for="card-number">Card Number <span aria-hidden="true">*</span></label>
            <input type="text" id="card-number" name="card-number" required aria-describedby="card-number-help">
            <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>
            <label for="card-expiry">Expiry Date <span aria-hidden="true">*</span></label>
            <input type="text" id="card-expiry" required>
            <br>
            <label for="card-cvv">CVV <span aria-hidden="true">*</span></label>
            <input type="text" id="card-cvv" required>
            <br>
            <button type="submit">Place Order</button>
        </form>
    </section>
</body>
</html>
